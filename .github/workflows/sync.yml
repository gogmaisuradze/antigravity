name: Build and sync to stitch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout antigravity
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Push dist to stitch
        run: |
          cd dist
          git init
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "deploy"
          git push --force https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/gogmaisuradze/stitch.git HEAD:main
