name: Sync antigravity to stitch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout antigravity
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Push to stitch
        run: |
          git remote add stitch https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/gogmaisuradze/stitch.git
          git push stitch main --force
